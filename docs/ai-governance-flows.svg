<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1230" width="1200" height="1230" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="apim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <style>
      .t     { fill:#e2e8f0; }
      .muted { fill:#94a3b8; font-size:13px; }
      .lbl   { fill:#cbd5e1; font-size:13px; }
      .box   { fill:#111c36; stroke:#334155; stroke-width:1.5; rx:12; }
      .pill  { font-size:12px; font-weight:600; }
      .wire  { stroke:#475569; stroke-width:2; fill:none; }
      .flow  { stroke:#38bdf8; stroke-width:2; fill:none; stroke-dasharray:8 10; opacity:.55;
               animation:dash 1.1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset:-36; } }
      .title { font-size:19px; font-weight:700; fill:#f1f5f9; }
      .num   { font-size:13px; font-weight:700; fill:#0b1020; }
    </style>
  </defs>

  <rect width="1200" height="1230" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <text x="600" y="44" text-anchor="middle" class="title" font-size="26">AI Governance Labs &#8212; End-to-End Flow</text>
  <text x="600" y="70" text-anchor="middle" class="muted">Microsoft Foundry Models behind Azure API Management &#183; policy-driven controls</text>

  <!-- ============ LAB 1 ============ -->
  <g transform="translate(0,96)">
    <rect x="30" y="8" width="1140" height="258" rx="16" fill="#0d1428" stroke="#1e293b"/>
    <circle cx="62" cy="40" r="13" fill="#38bdf8"/><text x="62" y="45" text-anchor="middle" class="num">1</text>
    <text x="86" y="45" class="title">Token limits &amp; quotas</text>
    <text x="300" y="45" class="muted">llm-token-limit &#183; TPM burst &#8594; 429 &#183; daily budget &#8594; 403</text>

    <rect class="box" x="60" y="120" width="150" height="70"/>
    <text x="135" y="150" text-anchor="middle" class="t" font-size="15" font-weight="600">Client app</text>
    <text x="135" y="170" text-anchor="middle" class="muted">chat/completions</text>

    <path class="wire" d="M210,155 H430" marker-end="url(#arrow)"/>
    <path class="flow" d="M210,155 H424"/>

    <rect x="430" y="100" width="270" height="110" rx="12" fill="url(#apim)" opacity=".92"/>
    <text x="565" y="132" text-anchor="middle" class="t" font-size="15" font-weight="700">Azure API Management</text>
    <text x="565" y="156" text-anchor="middle" fill="#e9d5ff" font-size="13">&lt;llm-token-limit&gt;</text>
    <text x="565" y="178" text-anchor="middle" fill="#e9d5ff" font-size="12">tokens-per-minute + token-quota</text>

    <path class="wire" d="M700,155 H930" marker-end="url(#arrow)"/>
    <path class="flow" d="M700,155 H924"/>

    <rect class="box" x="930" y="120" width="180" height="70"/>
    <text x="1020" y="150" text-anchor="middle" class="t" font-size="15" font-weight="600">Foundry Model</text>
    <text x="1020" y="170" text-anchor="middle" class="muted">chat deployment</text>

    <circle r="7" fill="#4ade80" filter="url(#glow)">
      <animateMotion dur="4s" repeatCount="indefinite" path="M210,155 H930"/>
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.05;.9;1"/>
    </circle>
    <circle r="7" fill="#fbbf24" filter="url(#glow)">
      <animateMotion dur="4s" begin="1.3s" repeatCount="indefinite" path="M210,155 H565" keyPoints="0;1;1" keyTimes="0;.45;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="4s" begin="1.3s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.05;.55;.62"/>
    </circle>
    <circle r="7" fill="#f87171" filter="url(#glow)">
      <animateMotion dur="4s" begin="2.6s" repeatCount="indefinite" path="M210,155 H565" keyPoints="0;1;1" keyTimes="0;.45;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="4s" begin="2.6s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.05;.55;.62"/>
    </circle>

    <g class="pill">
      <g><rect x="740" y="218" width="120" height="26" rx="13" fill="#052e1b" stroke="#16a34a"/>
        <text x="800" y="235" text-anchor="middle" fill="#4ade80">200 &#183; allowed</text>
        <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.08;.3;.36"/></g>
      <g><rect x="740" y="218" width="120" height="26" rx="13" fill="#3b2a06" stroke="#f59e0b">
        </rect>
        <text x="800" y="235" text-anchor="middle" fill="#fbbf24">429 &#183; Retry-After</text>
        <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.36;.42;.62;.68"/></g>
      <g><rect x="740" y="218" width="120" height="26" rx="13" fill="#3f1010" stroke="#dc2626"/>
        <text x="800" y="235" text-anchor="middle" fill="#f87171">403 &#183; quota gone</text>
        <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.68;.74;.95;1"/></g>
    </g>
    <text x="135" y="232" text-anchor="middle" class="muted">reads remaining-tokens</text>
  </g>

  <!-- ============ LAB 2 ============ -->
  <g transform="translate(0,372)">
    <rect x="30" y="8" width="1140" height="258" rx="16" fill="#0d1428" stroke="#1e293b"/>
    <circle cx="62" cy="40" r="13" fill="#a855f7"/><text x="62" y="45" text-anchor="middle" class="num">2</text>
    <text x="86" y="45" class="title">Metering &amp; chargeback</text>
    <text x="330" y="45" class="muted">llm-emit-token-metric &#183; split by API, Subscription, ClientApp</text>

    <rect class="box" x="60" y="100" width="150" height="54"/>
    <text x="135" y="123" text-anchor="middle" class="t" font-size="14" font-weight="600">claims-portal</text>
    <text x="135" y="141" text-anchor="middle" class="muted">x-client-app</text>
    <rect class="box" x="60" y="166" width="150" height="54"/>
    <text x="135" y="189" text-anchor="middle" class="t" font-size="14" font-weight="600">analyst-copilot</text>
    <text x="135" y="207" text-anchor="middle" class="muted">x-client-app</text>

    <path class="wire" d="M210,127 Q320,127 340,155 T430,160" marker-end="url(#arrow)"/>
    <path class="wire" d="M210,193 Q320,193 340,165 T430,160" marker-end="url(#arrow)"/>
    <path class="flow" d="M210,127 Q320,127 340,155 T424,160"/>
    <path class="flow" d="M210,193 Q320,193 340,165 T424,160"/>

    <rect x="430" y="105" width="270" height="110" rx="12" fill="url(#apim)" opacity=".92"/>
    <text x="565" y="137" text-anchor="middle" class="t" font-size="15" font-weight="700">APIM</text>
    <text x="565" y="161" text-anchor="middle" fill="#e9d5ff" font-size="13">&lt;llm-emit-token-metric&gt;</text>
    <text x="565" y="183" text-anchor="middle" fill="#e9d5ff" font-size="12">prompt &#183; completion &#183; total</text>

    <path class="wire" d="M700,140 H930" marker-end="url(#arrow)"/>
    <path class="flow" d="M700,140 H924"/>
    <rect class="box" x="930" y="110" width="180" height="60"/>
    <text x="1020" y="146" text-anchor="middle" class="t" font-size="15" font-weight="600">Foundry Model</text>

    <path class="wire" d="M565,215 V236 H930" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <rect class="box" x="930" y="196" width="180" height="60"/>
    <text x="1020" y="222" text-anchor="middle" class="t" font-size="14" font-weight="600">Application Insights</text>
    <text x="1020" y="242" text-anchor="middle" class="muted">customMetrics</text>

    <circle r="7" fill="#c084fc" filter="url(#glow)">
      <animateMotion dur="3.4s" repeatCount="indefinite" path="M210,127 Q320,127 340,155 T565,160 H930"/>
    </circle>
    <circle r="7" fill="#22d3ee" filter="url(#glow)">
      <animateMotion dur="3.4s" begin="1.7s" repeatCount="indefinite" path="M210,193 Q320,193 340,165 T565,160 H930"/>
    </circle>
    <circle r="5" fill="#fbbf24">
      <animateMotion dur="3.4s" begin=".9s" repeatCount="indefinite" path="M565,215 V236 H930"/>
    </circle>
  </g>

  <!-- ============ LAB 3 ============ -->
  <g transform="translate(0,648)">
    <rect x="30" y="8" width="1140" height="258" rx="16" fill="#0d1428" stroke="#1e293b"/>
    <circle cx="62" cy="40" r="13" fill="#f43f5e"/><text x="62" y="45" text-anchor="middle" class="num">3</text>
    <text x="86" y="45" class="title">Content safety &#8212; both directions</text>
    <text x="430" y="45" class="muted">llm-content-safety applied inbound AND outbound</text>

    <rect class="box" x="60" y="120" width="140" height="70"/>
    <text x="130" y="150" text-anchor="middle" class="t" font-size="15" font-weight="600">Client app</text>
    <text x="130" y="170" text-anchor="middle" class="muted">prompt</text>

    <path class="wire" d="M200,142 H300" marker-end="url(#arrow)"/>
    <rect x="300" y="108" width="150" height="66" rx="12" fill="#3f1020" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="375" y="132" text-anchor="middle" class="t" font-size="13" font-weight="700">INBOUND</text>
    <text x="375" y="152" text-anchor="middle" fill="#fda4af" font-size="11">prompt shield</text>
    <text x="375" y="166" text-anchor="middle" fill="#fda4af" font-size="11">4 harm categories</text>

    <path class="wire" d="M450,142 H560" marker-end="url(#arrow)"/>
    <rect class="box" x="560" y="112" width="160" height="60"/>
    <text x="640" y="138" text-anchor="middle" class="t" font-size="14" font-weight="600">Foundry Model</text>
    <text x="640" y="157" text-anchor="middle" class="muted">completion</text>

    <path class="wire" d="M720,142 H830" marker-end="url(#arrow)"/>
    <rect x="830" y="108" width="160" height="66" rx="12" fill="#3f1020" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="915" y="132" text-anchor="middle" class="t" font-size="13" font-weight="700">OUTBOUND</text>
    <text x="915" y="152" text-anchor="middle" fill="#fda4af" font-size="11">re-checks completion</text>
    <text x="915" y="166" text-anchor="middle" fill="#fda4af" font-size="11">window-size</text>

    <path class="wire" d="M990,142 H1110" marker-end="url(#arrow)"/>
    <text x="1050" y="132" text-anchor="middle" class="muted">200</text>

    <circle r="7" fill="#4ade80" filter="url(#glow)">
      <animateMotion dur="4.4s" repeatCount="indefinite" path="M200,142 H1110"/>
      <animate attributeName="opacity" dur="4.4s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.04;.55;.6"/>
    </circle>
    <circle r="7" fill="#f87171" filter="url(#glow)">
      <animateMotion dur="4.4s" begin="2.2s" repeatCount="indefinite" path="M200,142 H375" keyPoints="0;1;1" keyTimes="0;.35;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="4.4s" begin="2.2s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.04;.45;.52"/>
    </circle>
    <circle r="7" fill="#fb923c" filter="url(#glow)">
      <animateMotion dur="4.4s" begin="3.3s" repeatCount="indefinite" path="M720,142 H915" keyPoints="0;1;1" keyTimes="0;.35;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="4.4s" begin="3.3s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.04;.45;.52"/>
    </circle>

    <g class="pill">
      <rect x="315" y="196" width="130" height="26" rx="13" fill="#3f1010" stroke="#dc2626"/>
      <text x="380" y="213" text-anchor="middle" fill="#f87171">403 &#183; prompt blocked</text>
      <rect x="840" y="196" width="140" height="26" rx="13" fill="#3f2410" stroke="#ea580c"/>
      <text x="910" y="213" text-anchor="middle" fill="#fb923c">stream stops &#183; no [DONE]</text>
    </g>
    <text x="600" y="240" text-anchor="middle" class="muted">Models can produce unsafe output from benign prompts &#8212; inbound-only is not a safety program.</text>
  </g>

  <!-- ============ LAB 4 ============ -->
  <g transform="translate(0,924)">
    <rect x="30" y="8" width="1140" height="258" rx="16" fill="#0d1428" stroke="#1e293b"/>
    <circle cx="62" cy="40" r="13" fill="#22d3ee"/><text x="62" y="45" text-anchor="middle" class="num">4</text>
    <text x="86" y="45" class="title">Resilient backend pools</text>
    <text x="320" y="45" class="muted">priority &#8594; weight &#8594; health &#183; circuit breakers &#183; spillover</text>

    <rect class="box" x="60" y="120" width="150" height="70"/>
    <text x="135" y="146" text-anchor="middle" class="t" font-size="15" font-weight="600">Client app</text>
    <text x="135" y="168" text-anchor="middle" class="muted">byte-identical request</text>

    <path class="wire" d="M210,155 H430" marker-end="url(#arrow)"/>
    <path class="flow" d="M210,155 H424"/>

    <rect x="430" y="110" width="270" height="94" rx="12" fill="url(#apim)" opacity=".92"/>
    <text x="565" y="140" text-anchor="middle" class="t" font-size="15" font-weight="700">APIM pool backend</text>
    <text x="565" y="164" text-anchor="middle" fill="#e9d5ff" font-size="12">&lt;set-backend-service</text>
    <text x="565" y="182" text-anchor="middle" fill="#e9d5ff" font-size="12">backend-id="demo4-aoai-pool" /&gt;</text>

    <path class="wire" d="M700,150 Q820,150 880,108" marker-end="url(#arrow)"/>
    <path class="wire" d="M700,157 Q820,157 880,160" marker-end="url(#arrow)"/>
    <path class="wire" d="M700,164 Q820,164 880,215" stroke-dasharray="5 5" marker-end="url(#arrow)"/>

    <g>
      <rect class="box" x="885" y="84" width="225" height="48"/>
      <text x="905" y="113" class="t" font-size="14" font-weight="600">ptu-east</text>
      <text x="1090" y="113" text-anchor="end" fill="#94a3b8" font-size="12">P1 &#183; w2</text>
      <rect x="885" y="84" width="225" height="48" rx="12" fill="#3f1010" stroke="#dc2626" opacity="0">
        <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;.85;.85;0" keyTimes="0;.35;.42;.75;.82"/>
      </rect>
      <text x="1000" y="113" text-anchor="middle" fill="#f87171" font-size="13" font-weight="700" opacity="0">CIRCUIT OPEN &#183; 429
        <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.35;.42;.75;.82"/>
      </text>
    </g>

    <rect class="box" x="885" y="140" width="225" height="48"/>
    <text x="905" y="169" class="t" font-size="14" font-weight="600">ptu-central</text>
    <text x="1090" y="169" text-anchor="end" fill="#94a3b8" font-size="12">P1 &#183; w1</text>

    <rect class="box" x="885" y="196" width="225" height="48"/>
    <text x="905" y="225" class="t" font-size="14" font-weight="600">payg</text>
    <text x="1090" y="225" text-anchor="end" fill="#94a3b8" font-size="12">P2 &#183; spillover</text>

    <circle r="7" fill="#4ade80" filter="url(#glow)">
      <animateMotion dur="6s" repeatCount="indefinite" path="M210,155 H565 Q820,150 880,108"/>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;.34;.36;.8;.84"/>
    </circle>
    <circle r="7" fill="#22d3ee" filter="url(#glow)">
      <animateMotion dur="6s" begin="1s" repeatCount="indefinite" path="M210,155 H565 Q820,157 880,160"/>
    </circle>
    <circle r="7" fill="#fbbf24" filter="url(#glow)">
      <animateMotion dur="6s" begin="2.6s" repeatCount="indefinite" path="M210,155 H565 Q820,164 880,215"/>
      <animate attributeName="opacity" dur="6s" begin="2.6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.3;.36;.8;.86"/>
    </circle>

    <text x="470" y="238" text-anchor="middle" class="muted">No client change &#8212; only the backend id moves in traces.</text>
  </g>

  <text x="600" y="1212" text-anchor="middle" class="muted" font-size="12">github.com/waelkdouh/AIGovernanceOffering &#183; runnable, idempotent Jupyter notebooks</text>
</svg>
